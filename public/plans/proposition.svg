<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1000" viewBox="0 0 1450 1000" role="img" aria-label="Proposition : grande maison avec rez-de-chaussée, un étage, terrasse et piscine"><style>text{font-family:Arial,sans-serif;fill:#172d35}.title{font-size:28px;font-weight:bold}.sub{font-size:14px;fill:#52656b}.name{font-size:13px;font-weight:bold;text-anchor:middle}.small{font-size:11px;text-anchor:middle}</style><rect width="100%" height="100%" fill="#f4f1e9"/><text x="35" y="43" class="title">PROPOSITION À DISCUTER — RDC + 1 étage, sans sous-sol</text><text x="35" y="70" class="sub">Esquisse de gameplay, pas encore la maison jouable. Volumes plus grands, pièces en L, deux escaliers et circulation en boucle.</text><text x="355" y="115" class="name" style="font-size:22px">REZ-DE-CHAUSSÉE + JARDIN</text><text x="1100" y="115" class="name" style="font-size:22px">ÉTAGE</text><g><rect x="40" y="140" width="650" height="690" rx="3" fill="#dce6ce" stroke="#34474b" stroke-width="3"/><text x="365" y="482" class="name"></text></g><g><rect x="230" y="165" width="330" height="110" rx="3" fill="#91cbd4" stroke="#34474b" stroke-width="3"/><text x="395" y="217" class="name">PISCINE</text></g><g><rect x="110" y="295" width="520" height="100" rx="3" fill="#d8c49c" stroke="#34474b" stroke-width="3"/><text x="370" y="342" class="name">TERRASSE · BAR · INVITÉS</text></g><g><rect x="320" y="420" width="175" height="140" rx="3" fill="#ead087" stroke="#34474b" stroke-width="3"/><text x="407.5" y="487" class="name">SALLE À MANGER</text></g><g><rect x="495" y="420" width="155" height="140" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="572.5" y="487" class="name">CUISINE · VERRES</text></g><g><rect x="80" y="590" width="170" height="145" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="165" y="659.5" class="name">BUREAU / BIBLIOTHÈQUE</text></g><g><rect x="250" y="590" width="235" height="145" rx="3" fill="#d6cdb8" stroke="#34474b" stroke-width="3"/><text x="367.5" y="659.5" class="name">HALL · ESCALIER PRINCIPAL</text></g><g><rect x="485" y="590" width="165" height="85" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="567.5" y="629.5" class="name">WC / VESTIAIRE</text></g><g><rect x="485" y="675" width="165" height="125" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="567.5" y="734.5" class="name">GARAGE / BUANDERIE</text></g><g><rect x="250" y="735" width="235" height="65" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="367.5" y="764.5" class="name">ENTRÉE / PORCHE</text></g><path d="M320 560H495V590H485V650H250V590H320Z" fill="#d6cdb8" stroke="#34474b" stroke-width="3"/><path d="M80 420H320V560H390V635H250V590H80Z" fill="#ead087" stroke="#34474b" stroke-width="3"/><text x="200" y="500" class="name">GRAND SALON EN L · SOIRÉE</text><path d="M570 560V590M320 500H335M490 500H505M380 610H400M240 650H260M575 665V685M365 725V745M475 630H495M475 760H495" stroke="#ce8b3d" stroke-width="15"/><path d="M150 420H270M370 420H450M535 420H610" stroke="#2c9bb1" stroke-width="9"/><path d="M210 415V395M410 415V395" stroke="#ce8b3d" stroke-width="23"/><text x="575" y="578" class="small">↑ ESC. DE SERVICE</text><circle cx="665" cy="727" r="8" fill="#bf4741"/><text x="365" y="854" class="sub" text-anchor="middle">Façade élargie · ordre de grandeur : 50 × 32 m</text><g><rect x="790" y="190" width="240" height="180" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="910" y="277" class="name">SUITE PRINCIPALE</text></g><g><rect x="1055" y="190" width="110" height="80" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="1110" y="227" class="name">S. DE BAINS</text></g><g><rect x="1190" y="190" width="200" height="180" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="1290" y="277" class="name">CHAMBRE D’AMIS</text></g><g><rect x="790" y="410" width="200" height="165" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="890" y="489.5" class="name">CHAMBRE / BUREAU</text></g><g><rect x="990" y="410" width="200" height="165" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="1090" y="489.5" class="name">CHAMBRE</text></g><g><rect x="1190" y="410" width="200" height="100" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="1290" y="457" class="name">SALLE DE BAINS / WC</text></g><g><rect x="1190" y="510" width="200" height="65" rx="3" fill="#e8dfca" stroke="#34474b" stroke-width="3"/><text x="1290" y="539.5" class="name">LINGERIE</text></g><g><rect x="790" y="370" width="600" height="40" rx="3" fill="#d6cdb8" stroke="#34474b" stroke-width="3"/><text x="1090" y="387" class="name">PALIER · CIRCULATION EN BOUCLE</text></g><g><rect x="1055" y="295" width="110" height="75" rx="3" fill="#c7d9d9" stroke="#34474b" stroke-width="3"/><text x="1110" y="329.5" class="name">VIDE SUR HALL</text></g><g><rect x="1030" y="270" width="160" height="25" rx="3" fill="#d6cdb8" stroke="#34474b" stroke-width="3"/><text x="1110" y="279.5" class="name"></text></g><g><rect x="1030" y="295" width="25" height="75" rx="3" fill="#d6cdb8" stroke="#34474b" stroke-width="3"/><text x="1042.5" y="329.5" class="name"></text></g><g><rect x="1165" y="295" width="25" height="75" rx="3" fill="#d6cdb8" stroke="#34474b" stroke-width="3"/><text x="1177.5" y="329.5" class="name"></text></g><path d="M885 365V420M1080 405V420M1270 365V420M1110 260V280M1020 335H1040" stroke="#ce8b3d" stroke-width="15"/><text x="870" y="610" class="name">↑↓ Escalier principal</text><text x="1090" y="397" class="name">↑↓</text><text x="1280" y="610" class="name">↑↓ Escalier de service</text><text x="1330" y="397" class="name">↑↓</text><text x="790" y="680" class="sub">Intentions à choisir ensemble :</text><text x="790" y="712" class="sub">• Soirée répartie entre salon, terrasse et bar.</text><text x="790" y="744" class="sub">• Cuisine et toilettes : sorties occasionnelles, 1 ou 2 invités.</text><text x="790" y="776" class="sub">• Coffret dehors, près du garage : une réparation crée un détour.</text><text x="790" y="808" class="sub">• Deux escaliers : fuite possible sans impasse systématique.</text><text x="790" y="840" class="sub">• Fenêtres utilisables au RDC ; grandes baies vers la terrasse.</text><text x="40" y="920" class="sub">Orange : accès envisagés · Bleu : vitrages · Rouge : coffret. Les ouvertures, dimensions et meubles restent à ajuster.</text><text x="40" y="952" class="sub">Ce dessin sert à dire ce qu’on garde, déplace ou supprime. La piscine et ce nouveau plan ne sont pas encore intégrés au jeu.</text></svg>